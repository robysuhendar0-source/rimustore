<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rimuru Store V5.9 - Tempest Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rimuru-blue: #7dd3fc;
            --rimuru-aura: rgba(125, 211, 252, 0.2);
            --tempest-deep: #0f172a;
            --great-sage-purple: #818cf8;
        }

        body { 
            -webkit-user-select: none; 
            background: radial-gradient(circle at top right, #1e293b, #0f172a, #020617);
            color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        .hidden { display: none; }
        
        /* RIMURU SLIME GLOW EFFECT */
        .glass-card { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(125, 211, 252, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .rimuru-gradient-text {
            background: linear-gradient(to bottom, #fff, var(--rimuru-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ANIMASI POP UP ALA SKILL GREAT SAGE */
        .animate-pop { animation: sage-notice 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes sage-notice { 
            from { transform: translateY(20px) scale(0.9); opacity: 0; } 
            to { transform: translateY(0) scale(1); opacity: 1; } 
        }

        /* BUTTON STYLE: RIMURU SKILL */
        .btn-rimuru {
            background: linear-gradient(45deg, #0ea5e9, #6366f1);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
        }
        .btn-rimuru:active { transform: scale(0.95); filter: brightness(1.2); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* SHIMMER SEPERTI AURA */
        .shimmer-btn { position: relative; overflow: hidden; }
        .shimmer-btn::after {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg); animation: aura-flow 4s infinite;
        }
        @keyframes aura-flow { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }

        .status-badge {
            background: var(--rimuru-aura);
            border-left: 3px solid var(--rimuru-blue);
        }

        input, select {
            background: rgba(2, 6, 23, 0.8) !important;
            border: 1px solid rgba(125, 211, 252, 0.2) !important;
            transition: all 0.3s;
        }
        input:focus { border-color: var(--rimuru-blue) !important; box-shadow: 0 0 10px var(--rimuru-aura); }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="resultModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 modal-overlay">
    <div class="glass-card w-full max-w-sm rounded-[2rem] overflow-hidden flex flex-col animate-pop border-2 border-sky-400">
        <div class="p-6 bg-sky-500/20 border-b border-sky-400/20 text-center">
            <h2 class="text-sky-300 font-black tracking-[0.2em] uppercase italic text-sm">💠 SUCCESS EVOLUTION 💠</h2>
        </div>
        <div class="p-8 text-center">
            <p id="resPaket" class="text-[10px] text-sky-400 font-bold uppercase mb-2 tracking-widest"></p>
            <div class="bg-slate-950/80 p-5 rounded-2xl border border-sky-900/50 mb-6 group">
                <p id="resAccount" class="text-white font-mono text-sm break-all font-bold group-hover:text-sky-300 transition-colors"></p>
            </div>
            <button onclick="copyAccountResult()" class="w-full btn-rimuru p-4 rounded-2xl font-black text-xs uppercase shadow-lg mb-3">Salin Skill Akun</button>
            <button onclick="closeModal('resultModal'); location.reload();" class="w-full btn-secondary p-4 rounded-2xl font-black text-xs uppercase text-slate-400">Kembali ke Federasi</button>
        </div>
    </div>
</div>

<div id="priceModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
    <div class="glass-card w-full max-w-md max-h-[85vh] rounded-[2rem] overflow-hidden flex flex-col animate-pop border border-sky-500/30 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
        <div class="p-6 border-b border-sky-500/20 flex justify-between items-center bg-sky-500/10">
            <h2 class="text-sky-300 font-black tracking-widest text-sm uppercase italic">📜 SCROLL OF TEMPEST</h2>
            <button onclick="closeModal('priceModal')" class="text-sky-400 font-bold text-2xl">&times;</button>
        </div>
        <div class="p-6 overflow-y-auto text-[11px] space-y-4 whitespace-pre-wrap custom-scrollbar text-slate-300 leading-relaxed">
            [Konten Harga Rimuru Store]
        </div>
        <div class="p-4 bg-slate-900/50 border-t border-sky-500/20 text-center">
            <button onclick="closeModal('priceModal')" class="px-8 py-3 btn-secondary rounded-xl font-bold text-[10px] uppercase text-sky-400">Tutup Scroll</button>
        </div>
    </div>
</div>

<div id="loginSection" class="flex h-screen items-center justify-center p-6">
    <div class="glass-card p-10 rounded-[2.5rem] w-full max-w-sm shadow-2xl border border-sky-400/20 relative overflow-hidden">
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-sky-500/20 rounded-full blur-3xl"></div>
        <div class="relative z-10 text-center">
            <div class="mb-2 inline-block p-4 rounded-full bg-sky-500/10 border border-sky-400/20 mb-4 shadow-inner">
                <span class="text-4xl">💧</span>
            </div>
            <h2 class="text-4xl font-black mb-2 rimuru-gradient-text italic tracking-tighter">RIMURU</h2>
            <p class="text-[10px] text-sky-400/60 font-bold uppercase tracking-[0.3em] mb-8">Tempest Federation</p>
            
            <div class="space-y-4">
                <input type="text" id="user" placeholder="Nama Monster" class="w-full p-4 bg-slate-900 rounded-2xl border border-sky-900/30 outline-none text-white text-center font-bold">
                <input type="password" id="pass" placeholder="Sandi Rahasia" class="w-full p-4 bg-slate-900 rounded-2xl border border-sky-900/30 outline-none text-white text-center font-bold">
                <button onclick="handleLogin()" id="btnLogin" class="w-full btn-rimuru p-4 rounded-2xl font-black uppercase text-sm shadow-lg active:scale-95 transition-all shimmer-btn">Identity Manifest</button>
            </div>
        </div>
    </div>
</div>

<div id="appSection" class="hidden p-4 max-w-md mx-auto pb-12">
    <div class="flex justify-between items-end mb-8 mt-6">
        <div>
            <p class="text-[10px] text-sky-400 font-black tracking-[0.2em] mb-1">MONSTER FEDERATION</p>
            <h1 class="text-2xl font-black text-white italic tracking-tighter">RIMURU<span class="text-sky-400"> STORE</span></h1>
            <div id="userStatusTag" class="mt-2 text-[9px] py-1 px-3 status-badge text-sky-300 font-bold uppercase italic inline-block"></div>
        </div>
        <button onclick="handleLogout()" class="p-3 bg-red-500/10 text-red-400 rounded-2xl border border-red-500/20 text-[10px] font-black hover:bg-red-500 hover:text-white transition-all">EXIT</button>
    </div>

    <div class="glass-card p-5 rounded-3xl mb-6 flex justify-between items-center shadow-inner relative overflow-hidden">
        <div class="absolute right-0 top-0 opacity-10 pointer-events-none">
            <span class="text-6xl">💎</span>
        </div>
        <div class="relative z-10">
            <span class="text-slate-400 text-[9px] font-bold uppercase tracking-widest block mb-1 italic text-sky-400/60">MANA COLLECTED:</span>
            <span id="userRevenue" class="text-2xl font-black text-white tracking-tight">Rp 0</span>
        </div>
        <button onclick="openModal('userPassModal')" class="bg-sky-400/10 p-3 rounded-xl border border-sky-400/20">
            <span class="text-lg">⚙️</span>
        </button>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-3">
        <button onclick="openModal('priceModal')" class="glass-card p-4 rounded-2xl text-sky-300 font-black text-[10px] tracking-widest shadow-lg border-b-2 border-sky-500/40 uppercase">📜 Price List</button>
        <button onclick="openModal('updateModal')" class="glass-card p-4 rounded-2xl text-slate-400 font-black text-[10px] tracking-widest shadow-lg italic uppercase">📢 Skill Logs</button>
    </div>
    <button onclick="openModal('resellerModal')" class="w-full glass-card p-4 rounded-2xl text-indigo-300 font-black text-[10px] tracking-[0.4em] mb-8 shadow-lg uppercase border-t border-white/5">💰 User Pricing</button>

    <div id="adminPanel" class="hidden mb-8 space-y-3">
        <div class="p-6 bg-indigo-600/10 border-2 border-indigo-500/30 rounded-[2.5rem] relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-20"><span class="text-3xl">🔱</span></div>
            <h3 class="text-indigo-400 font-black text-[11px] uppercase mb-5 tracking-[0.2em] text-center italic">Authority: GREAT SAGE</h3>
            
            <div class="bg-slate-950/80 p-4 rounded-2xl border border-indigo-500/20 mb-4">
                <canvas id="adminChart" class="w-full h-32"></canvas>
            </div>
            
            <div class="flex justify-between items-center bg-slate-950 p-4 rounded-2xl mb-4 border-l-4 border-indigo-500">
                <span class="text-slate-400 text-[9px] font-black uppercase italic">GLOBAL OMSET:</span>
                <div id="adminGlobalRevenue" class="text-right font-black text-indigo-400 text-sm">Rp 0</div>
            </div>

            <button onclick="syncDatabase()" id="btnSync" class="w-full btn-rimuru p-4 rounded-2xl font-black text-[10px] uppercase shadow-lg mb-4 shimmer-btn tracking-widest">🧹 Harmonize Database</button>
            
            <div class="grid grid-cols-2 gap-2">
                <button onclick="showAdminFeature('addUser')" class="bg-slate-900/50 p-3 rounded-xl text-[9px] font-bold text-slate-300 border border-white/5 hover:bg-indigo-500/20 transition-colors uppercase">+ New Monster</button>
                <button onclick="showAdminFeature('addStock')" class="bg-slate-900/50 p-3 rounded-xl text-[9px] font-bold text-slate-300 border border-white/5 hover:bg-indigo-500/20 transition-colors uppercase">+ Stock Skill</button>
            </div>
            <div id="adminForm" class="hidden mt-4 pt-4 border-t border-indigo-500/20 space-y-3">
                <div id="formContent"></div>
                <button id="btnAdminSubmit" onclick="submitAdminAction()" class="w-full bg-white text-indigo-900 p-3 rounded-xl font-black text-[10px] uppercase shadow-xl">Execute Command</button>
            </div>
        </div>
    </div>

    <div class="glass-card p-8 rounded-[2.5rem] mb-8 shadow-2xl relative border-t border-white/10">
        <div class="absolute -top-4 left-1/2 -translate-x-1/2 bg-sky-500 px-4 py-1 rounded-full text-[9px] font-black uppercase tracking-widest text-indigo-950">MANIFESTATION</div>
        
        <div class="mb-5">
            <label class="text-[10px] text-sky-400/60 font-black mb-2 block uppercase tracking-widest italic">Select Skill Tier:</label>
            <select id="paket" class="w-full p-4 bg-slate-950 rounded-2xl border-none text-sm text-white font-bold outline-none ring-1 ring-sky-500/20 focus:ring-sky-500"></select>
        </div>

        <div class="mb-8">
            <label class="text-[10px] text-sky-400/60 font-black mb-2 block uppercase tracking-widest italic">Energy Receipt (Transfer):</label>
            <div class="relative">
                <input type="file" id="bukti" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-[10px] file:font-black file:bg-sky-500/10 file:text-sky-400">
            </div>
        </div>

        <button id="btnGen" disabled onclick="handleGen()" class="w-full btn-rimuru p-5 rounded-3xl font-black uppercase text-sm shadow-[0_10px_20px_rgba(14,165,233,0.3)] active:scale-95 transition-all shimmer-btn">GENERATE SKILL</button>
    </div>

    <div class="glass-card p-6 rounded-[2.5rem] shadow-lg border-b border-white/5">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] italic">Evolution Logs</h3>
            <span class="h-2 w-2 rounded-full bg-sky-500 shadow-[0_0_10px_#0ea5e9] animate-pulse"></span>
        </div>
        <div id="historyList" class="space-y-4 max-h-96 overflow-y-auto custom-scrollbar pr-2 text-center">
            </div>
    </div>
</div>
